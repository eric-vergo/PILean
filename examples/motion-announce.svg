  <title>A mark that announces the next turn</title>
  <desc>A triangle turns about A, then about B, then slides down; a ring marks the centre of each turn before it. The triangle; the ring at A marks the next turn, a quarter about A. Turned a quarter about A; the ring at B marks the next turn, a quarter about B. Turned a quarter about B, then slid down by 2.</desc>

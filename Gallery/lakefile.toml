name = "gallery"
defaultTargets = ["gallery"]

[[require]]
name = "PILean"
path = ".."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.31.0"

[[lean_lib]]
name = "GalleryLib"
globs = ["GalleryLib.+"]

[[lean_exe]]
name = "gallery"
root = "GalleryLib.Main"

[[lean_exe]]
name = "tdcsg-carrier-lines"
root = "GalleryLib.TDCSG.CarrierLines.Main"
